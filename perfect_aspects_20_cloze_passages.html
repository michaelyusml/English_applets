<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfect Simple vs Perfect Continuous — 20 Cloze Passages</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#172033;background:#f4f6fa}
*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:850px;margin:auto;background:white;border-radius:18px;padding:clamp(18px,4vw,32px);box-shadow:0 8px 30px #10204012}
h1{font-size:clamp(1.5rem,4vw,2.1rem);margin:.1em 0}h2{margin:.2em 0}.muted{color:#657188}.badge{display:inline-block;background:#e7f0ff;color:#2459a6;padding:5px 10px;border-radius:20px;font-size:.85rem}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}nav button{width:42px;height:38px;border:1px solid #ccd4e2;background:white;border-radius:9px;cursor:pointer}button{cursor:pointer;font:inherit}nav button.active,.primary{background:#2459a6;color:white;border-color:#2459a6}
.passage{background:#f3f6fb;border-radius:12px;padding:18px;line-height:1.9;font-size:1.05rem;margin:18px 0}
.gap{display:inline-block;min-width:145px;max-width:100%;padding:5px 7px;border:1px solid #aab8cc;border-radius:7px;background:white;color:#174b9a;font-weight:600}
.answers{display:grid;gap:12px}.answer{border:1px solid #dce2eb;padding:12px;border-radius:10px}input{width:100%;font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:8px;margin-top:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions button{padding:10px 15px;border-radius:9px;border:1px solid #cbd5e1;background:white}.primary{background:#2459a6!important;color:white!important}
.feedback{margin-top:15px;padding:14px;background:#eef4ff;border-radius:10px}.correct{color:#137a42}.wrong{color:#a52c2c}.small{font-size:.9rem}@media(max-width:550px){body{padding:9px}nav button{width:35px}}
</style></head><body><main>
<span class="badge">Grammar practice · 20 passages · 60 gaps</span>
<h1>Perfect Simple vs Perfect Continuous</h1>
<p class="muted">Literary-inspired cloze passages. Complete each verb phrase using the context. Some alternative answers may be grammatically possible.</p>
<nav id="nav"></nav>
<div id="content"></div>
</main>
<script>
const data=[["Alice's Adventures in Wonderland", "Lewis Carroll · Fantasy", "Alice ________ down the rabbit hole for what seemed like an eternity. She ________ several curious objects on the way, but she ________ anything quite so extraordinary before.", ["fall", "notice", "see"], ["had been falling", "had noticed", "had seen"]], ["Sherlock Holmes: The Missing Jewels", "Arthur Conan Doyle · Detective fiction", "Holmes ________ (investigate) the theft for three days. He ________ (question) every servant in the house and ________ (discover) a small piece of blue fabric beneath the window.", ["investigate", "question", "discover"], ["had been investigating", "had questioned", "had discovered"]], ["Frankenstein", "Mary Shelley · Gothic fiction", "Victor ________ (work) in his laboratory for months. He ________ (collect) specimens from distant graveyards, and he ________ (not sleep) properly for several weeks.", ["work", "collect", "sleep"], ["had been working", "had collected", "had not been sleeping"]], ["Jane Eyre", "Charlotte Brontë · Victorian fiction", "Jane ________ (live) at Thornfield for some time when she began to notice strange occurrences. She ________ (hear) unexplained laughter on several occasions, and she ________ (become) increasingly uneasy.", ["live", "hear", "become"], ["had been living", "had heard", "had become"]], ["Pride and Prejudice", "Jane Austen · Social comedy", "Elizabeth ________ (meet) Mr Darcy several times before she began to understand his character. She ________ (form) an unfavourable opinion of him, but she ________ (gradually / realise) that her judgement might have been mistaken.", ["meet", "form", "realise"], ["had met", "had formed", "had gradually been realising"]], ["Great Expectations", "Charles Dickens · Victorian fiction", "Pip ________ (dream) of becoming a gentleman for years. Since his unexpected good fortune, he ________ (spend) money carelessly, and he ________ (make) several new acquaintances in London.", ["dream", "spend", "make"], ["had been dreaming", "has been spending", "has made"]], ["Oliver Twist", "Charles Dickens · Social novel", "The boys ________ (wait) for their supper for hours. They ________ (receive) only a small portion of food that evening, and Oliver ________ (gather) the courage to ask for more.", ["wait", "receive", "gather"], ["had been waiting", "had received", "had gathered"]], ["Treasure Island", "Robert Louis Stevenson · Adventure", "Jim ________ (search) the island since dawn. He ________ (find) a series of strange footprints near the beach, and he ________ (follow) them towards a dense forest.", ["search", "find", "follow"], ["had been searching", "had found", "had followed"]], ["Dracula", "Bram Stoker · Gothic horror", "The villagers ________ (warn) Jonathan about the castle for weeks. He ________ (ignore) their warnings, believing them to be superstition. By the time he understood the danger, he ________ (already / enter) the castle.", ["warn", "ignore", "enter"], ["had been warning", "had ignored", "had already entered"]], ["The War of the Worlds", "H. G. Wells · Science fiction", "For several nights, astronomers ________ (observe) unusual flashes on Mars. Scientists ________ (publish) several theories, but nobody ________ (identify) the true cause of the mysterious activity.", ["observe", "publish", "identify"], ["had been observing", "had published", "had identified"]], ["The Secret Garden", "Frances Hodgson Burnett · Children's literature", "Mary ________ (explore) the grounds every morning since her arrival. She ________ (discover) the hidden entrance, and she ________ (work) tirelessly to restore the neglected garden.", ["explore", "discover", "work"], ["has been exploring", "has discovered", "has been working"]], ["Around the World in Eighty Days", "Jules Verne · Adventure", "Phileas Fogg ________ (travel) across several continents in a remarkably short time. He ________ (cross) oceans, ________ (visit) distant cities and now faces one final challenge before his deadline.", ["travel", "cross", "visit"], ["has been travelling", "has crossed", "has visited"]], ["Moby-Dick", "Herman Melville · Maritime fiction", "The crew ________ (sail) through rough seas for weeks. Captain Ahab ________ (refuse) to abandon his pursuit, despite the fact that several sailors ________ (express) serious concerns about the voyage.", ["sail", "refuse", "express"], ["had been sailing", "has refused", "have expressed"]], ["A Christmas Carol", "Charles Dickens · Christmas fiction", "Scrooge ________ (accumulate) wealth throughout his life, but he ________ (never / understand) the value of generosity. Recently, he ________ (think) more frequently about his lonely childhood.", ["accumulate", "understand", "think"], ["had accumulated", "had never understood", "has been thinking"]], ["The Hound of the Baskervilles", "Arthur Conan Doyle · Mystery", "The family ________ (live) with the legend of the hound for generations. Dr Mortimer ________ (collect) historical documents for years, and Holmes ________ (now / identify) an important inconsistency in the evidence.", ["live", "collect", "identify"], ["has lived", "has been collecting", "has now identified"]], ["Little Women", "Louisa May Alcott · Family fiction", "The March sisters ________ (support) one another through difficult times. Jo ________ (write) stories since she was a child, and she ________ (recently / sell) one of her manuscripts to a magazine.", ["support", "write", "sell"], ["have supported", "has been writing", "has recently sold"]], ["Robinson Crusoe", "Daniel Defoe · Adventure", "Robinson ________ (live) alone on the island for many years. He ________ (build) a shelter, ________ (grow) crops and developed an impressive understanding of the local environment.", ["live", "build", "grow"], ["had been living", "had built", "had grown"]], ["The Wind in the Willows", "Kenneth Grahame · Children's literature", "Mole ________ (enjoy) his new life by the river. Rat ________ (show) him the most beautiful places along the bank, and they ________ (spend) many pleasant afternoons together.", ["enjoy", "show", "spend"], ["has been enjoying", "has shown", "have spent"]], ["The Three Musketeers", "Alexandre Dumas · Historical adventure", "The musketeers ________ (defend) the honour of the crown for many years. They ________ (face) numerous enemies, but they ________ (never / abandon) one another in moments of danger.", ["defend", "face", "abandon"], ["have been defending", "have faced", "have never abandoned"]], ["Hamlet", "William Shakespeare · Tragedy", "Hamlet ________ (consider) his father's death for some time. He ________ (discover) disturbing evidence about the king, and he ________ (not decide) how to confront him.", ["consider", "discover", "decide"], ["has been considering", "has discovered", "has not decided"]]];
let current=0,values={},revealed=false;
const nav=document.getElementById('nav'),content=document.getElementById('content');
function render(){
 nav.innerHTML=data.map((p,i)=>`<button class="${i===current?'active':''}" onclick="go(${i})">${i+1}</button>`).join('');
 const p=data[current];
 let text=p[2], prompts=p[3], answers=p[4];
 // Insert numbered gaps in the passage based on the number of blanks, preserving prompts separately.
 let count=0;
 let passage=text.replace(/________/g,()=>`<span class="gap">[Gap ${++count}]</span>`);
 let fields=prompts.map((verb,i)=>`<div class="answer"><strong>Gap ${i+1} · ${verb}</strong><input aria-label="Gap ${i+1}" value="${escapeAttr(values[current+'-'+i]||'')}" oninput="save(${i},this.value)" placeholder="Complete verb phrase">${revealed?`<div class="small"><strong>Suggested answer:</strong> ${answers[i]}</div>`:''}</div>`).join('');
 content.innerHTML=`<span class="badge">Passage ${current+1} of 20</span><h2>${p[0]}</h2><p class="muted">${p[1]}</p><div class="passage">${passage}</div><h3>Complete the verb phrases</h3><p class="muted small">Use the verb prompts and supply the complete tense, including auxiliary verbs.</p><div class="answers">${fields}</div><div class="actions"><button class="primary" onclick="check()">Check answers</button><button onclick="toggle()"> ${revealed?'Hide':'Show'} suggested answers</button><button onclick="go(current-1)" ${current===0?'disabled':''}>← Previous</button><button onclick="go(current+1)" ${current===19?'disabled':''}>Next →</button></div>${revealed?scoreBox(p):''}`;
}
function escapeAttr(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function save(i,v){values[current+'-'+i]=v}
function go(i){if(i<0||i>=data.length)return;current=i;revealed=false;render()}
function toggle(){revealed=!revealed;render()}
function check(){revealed=true;render();const p=data[current],ans=p[4];let score=ans.filter((a,i)=>(values[current+'-'+i]||'').trim().toLowerCase().replace(/[.!?]/g,'')===a.toLowerCase()).length;document.getElementById('score').innerHTML=`<strong>Score: ${score} / ${ans.length}</strong><p>Suggested answers are shown. Consider whether a different aspect could also be valid in context.</p>`}
function scoreBox(p){return `<div class="feedback" id="score"><strong>Suggested answers</strong><p>Compare your responses with the answers above. Some alternatives may be possible depending on the intended emphasis.</p></div>`}
render();
</script></body></html>
